name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, staging]
    environment:
      name: staging
      url: http://10.176.155.62:3000
    concurrency:
      group: deploy-staging        # un seul déploiement à la fois sur staging
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # même commit que l'image

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Replace container
        run: |
          docker rm -f todo || true
          docker run -d --name todo \
            --restart unless-stopped \
            -p 3000:3000 \
            -v todo-db:/etc/todos \
            "$IMAGE"

      - name: Wait for container to be healthy
        run: ./scripts/wait-healthy.sh todo

      - name: Check from host (port mapping)
        run: curl -fsS localhost:3000/health

  deploy-production:
    needs: deploy-staging          # seulement si staging a réussi
    runs-on: [self-hosted, prod]   # le label du runner de la VM prod
    environment:
      name: production             # l'environnement protégé : attend ton approbation
      url: http://10.176.155.192:3000
    concurrency:
      group: deploy-production     # un seul déploiement à la fois en production
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # même commit que l'image

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Replace container
        run: |
          docker rm -f todo || true
          docker run -d --name todo \
            --restart unless-stopped \
            -p 3000:3000 \
            -v todo-db:/etc/todos \
            "$IMAGE"

      - name: Wait for container to be healthy
        run: ./scripts/wait-healthy.sh todo

      - name: Check from host (port mapping)
        run: curl -fsS localhost:3000/health
