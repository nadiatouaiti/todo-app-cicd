name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, staging]
    environment:
      name: staging
      url: http://10.176.155.62:3000
    concurrency:
      group: deploy-staging        # un seul déploiement à la fois sur staging
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Replace container
        run: |
          docker rm -f todo || true
          docker run -d --name todo \
            --restart unless-stopped \
            -p 3000:3000 \
            -v todo-db:/etc/todos \
            "$IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fsS localhost:3000/items > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond in 30s"
          docker logs todo
          exit 1

  deploy-production:
    needs: deploy-staging          # seulement si staging a réussi
    runs-on: [self-hosted, prod]   # le label du runner de la VM prod
    environment:
      name: production             # l'environnement protégé : attend ton approbation
      url: http://10.176.155.192:3000
    concurrency:
      group: deploy-production     # un seul déploiement à la fois en production
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Replace container
        run: |
          docker rm -f todo || true
          docker run -d --name todo \
            --restart unless-stopped \
            -p 3000:3000 \
            -v todo-db:/etc/todos \
            "$IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fsS localhost:3000/items > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond in 30s"
          docker logs todo
          exit 1