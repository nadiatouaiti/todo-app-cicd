# Nom du workflow, affiché dans l'onglet Actions et sur la PR
name: CI

# Quand le workflow se déclenche
on:
  pull_request:          # à chaque PR qui vise main (et à chaque nouveau commit dans la PR)
    branches: [main]
  push:                  # à chaque push direct sur main (par exemple après un merge)
    branches: [main]
    paths-ignore:
      - '**.md'          # on ignore les changements de fichiers Markdown

jobs:
  test:                          # nom du job
    runs-on: ubuntu-24.04       # VM Ubuntu neuve fournie par GitHub

    steps:
      # 1. La VM est vide : on y clone le dépôt
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. On installe Node, dans la version écrite dans .nvmrc
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # 3. On installe les dépendances exactes du package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. On lance les tests. Code de sortie différent de 0 = job en échec
      - name: Run tests
        run: npm test

  build:                         # 2e job : construit et teste l'image Docker
    needs: test                  # ne démarre que si le job "test" a réussi
    runs-on: ubuntu-24.04       # une autre VM neuve, indépendante de celle de "test"
    permissions:                 # droits du jeton GITHUB_TOKEN pour ce job
      contents: read             # lire le code du dépôt (pour le checkout)
      packages: write            # pour push de l'image Docker vers GitHub Packages(publier des images sur ghcr.io)

    steps:
      # 1. Nouvelle VM, donc on clone à nouveau le dépôt
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. On construit l'image avec le Dockerfile (pas besoin de Node sur la VM)
      - name: Build Docker image
        run: docker build -t todo-app:ci .

      # 3. On lance un conteneur à partir de cette image
      - name: Start container
        run: docker run -d --name todo -p 3000:3000 todo-app:ci

      # 4. On vérifie que l'app lit ET écrit (leçon du SQLITE_READONLY)
      - name: Wait for container to be healthy
        run: ./scripts/wait-healthy.sh todo

      - name: Smoke test (read and write)
        run: |
          curl -fsS localhost:3000/health
          curl -fsS -X POST -H 'Content-Type: application/json' \
               -d '{"name":"ci smoke test"}' localhost:3000/items
          curl -fsS localhost:3000/items | grep "ci smoke test"
      
      # 5. Connexion au registre (uniquement après un merge sur main)
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 6. On publie l'image testée, avec deux tags
      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag todo-app:ci "$IMAGE:${{ github.sha }}"
          docker tag todo-app:ci "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
      
      # 7. On affiche toujours les logs, même si une étape précédente a échoué
      - name: Show container logs
        if: always()
        run: docker logs todo
          